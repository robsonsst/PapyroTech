<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PapyroTech - Resultados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/resultados.css" />
  </head>
  <body>
    <div class="container-principal">
      <nav class="navbar">
        <div class="nav-left">
          <div class="nav-brand">
            <div class="nav-logo-imagem-container">
              <img src="logos/LOGO2.png" width="50" height="50" alt="Logo PapyroTech Mini" class="nav-logo-img" />
            </div>
            <div class="nav-title">PapyroTech</div>
          </div>
          <ul class="nav-links">
            <li><a href="busca.html" class="nav-link-inicio">Início</a></li>
            <li><a href="catalogo.html">Catálogos</a></li>
            <li><a href="#">Sobre nós</a></li>
          </ul>
        </div>

        <div class="nav-right">
          <div class="nav-user-info">
            <div class="nav-ceep-imagem-container">
              <img src="logos/logoceep3.png" width="50" height="50" alt="Logo CEEP" class="nav-ceep-img" />
            </div>
            <span class="nav-username">CEEP REGIS PACHECO</span>
          </div>
        </div>
      </nav>

      <main class="results-section">
        <div class="results-overlay">
          <div class="results-container">
            <aside class="sidebar-filtros">
              <h2>FILTROS</h2>
              <div class="filter-group">
                <label>Título</label>
                <input type="text" class="filter-input" />
              </div>
              <div class="filter-group">
                <label>Gênero</label>
                <input type="text" class="filter-input" />
              </div>
              <div class="filter-group">
                <label>Autor</label>
                <input type="text" class="filter-input" />
              </div>
              <button class="filter-btn">Buscar</button>
            </aside>

            <section class="results-content">
              <h1 class="results-title">Resultados</h1>

              <div class="book-card">
                <div class="book-cover">
                  <img src="logos/images (6).jpg" alt="Capitães da Areia" />
                </div>
                <div class="book-info">
                  <p><strong>titulo:</strong> capitães de areia</p>
                  <p><strong>autor:</strong> jorge amado</p>
                  <p><strong>gênero:</strong> romance</p>
                  <p class="book-isbn">
                    <strong>isbn:</strong> 273544534523453
                  </p>
                </div>
                <div class="book-action">
                  <button id="btn-solicitar" class="btn-solicitar">solicitar retirada</button>
                </div>
              </div>

              <div class="confirm-container">
                <a href="resumo.html" class="btn-confirmar">confirmar retirada</a>
              </div>
            </section>
          </div>
        </div>
      </main>

      <footer class="footer">
        <div class="footer-links">
         <h3>PapyroTech todos os direitos resevados</h3>
        </div>
        <a href="index.html" class="footer-icon-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Standby
        </a>
      </footer>
    </div>

    <script>
      const btnSolicitar = document.getElementById('btn-solicitar');
      if (btnSolicitar) {
        btnSolicitar.addEventListener('click', () => {
          if (btnSolicitar.classList.contains('solicitado')) {
            btnSolicitar.classList.remove('solicitado');
            btnSolicitar.textContent = 'solicitar retirada';
            btnSolicitar.style.backgroundColor = 'var(--primary-blue)';
          } else {
            btnSolicitar.classList.add('solicitado');
            btnSolicitar.textContent = 'cancelar retirada';
            btnSolicitar.style.backgroundColor = '#ef4444';
          }
        });
      }
    </script>
  </body>
</html>
