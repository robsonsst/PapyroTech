  <body>
    <div class="container-principal">
      <nav class="navbar">
        <div class="nav-left">
          <div class="nav-brand">
            <div class="nav-logo-imagem-container">
              <img src="logos/LOGO2.png" width="50" height="50" alt="Logo PapyroTech Mini" class="nav-logo-img" />

      <main class="search-section">
        <div class="search-overlay">
          <div class="search-content">
            <div class="search-bar">
            <div class="search-bar">
    <form action="resultados.html" method="GET" onsubmit="return validarBusca(event)">
    <input type="text" id="input-busca" name="q" placeholder="Digite o nome do livro, autor ou gênero...">
  
       
    <!-- O botão azul agora faz o envio do formulário -->
    <button type="submit" class="search-button">Buscar</button>
  </form>
</div>
        </div>
      </main>

      <footer class="footer">
        <div class="footer-links">
          <a href="#">PapyroTech todos os diretos resevados</a>
        </div>
        <a href="index.html" class="footer-icon-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Standby
        </a>
      </footer>
    </div>
<script>      
function validarBusca(event) {
  const inputBusca = document.getElementById('input-busca');
  const valor = inputBusca.value.trim();

  if (valor === '') {
    if (event) event.preventDefault();
    alert('Por favor, digite o nome do livro, autor ou gênero para continuar.');
    inputBusca.focus();
    return false;
  }

  // Se houver texto, o formulário envia automaticamente para resultados.html
  return true;
}
</script>

<script>      
document.addEventListener("DOMContentLoaded", () => {
  // Seleciona o formulário e o campo de texto pelo selector do CSS
  const formBusca = document.querySelector("form");
  const campoBusca = document.querySelector('input[type="search"]') || document.querySelector('input[type="text"]');

  if (formBusca && campoBusca) {
      formBusca.addEventListener("submit", (event) => {
          const textoDigitado = campoBusca.value.trim();

          // Se digitou apenas 1 caractere, bloqueia o envio e mostra o alerta
          if (textoDigitado.length === 1) {
              event.preventDefault(); // Trava o envio para a próxima tela
              alert("Por favor, digite o nome do autor, gênero ou título completo");
          }
      });
  }
});
</script>
  </body>
</html>
